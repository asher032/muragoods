# Render Blueprint — repo-root level so "New + → Blueprint" just works.
# All paths run inside discord-bot/ via rootDir, so requirements.txt and the
# bot package resolve correctly.

services:
  - type: web
    name: murastream-bot-pf11
    runtime: python
    # Paid Render service keeps the Discord gateway process running 24/7.
    # The free plan sleeps and disconnects the bot from Discord.
    plan: starter
    region: oregon
    rootDir: discord-bot
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    autoDeploy: true
    # NOTE: keep this env set identical to discord-bot/render.yaml — whichever
    # blueprint was last applied wins, and drift here is how production
    # silently loses music auth (YOUTUBE_PROXY/YT_COOKIES) or TMDB.
    envVars:
      - key: DISCORD_TOKEN
        sync: false          # set in the Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        value: "1549395794853888020"
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: MURASTREAM_URL
        value: "https://muragoods.vercel.app"
      - key: TMDB_API_KEY
        sync: false          # optional; the site proxy works without it
      - key: MONGO_URI
        sync: false          # MongoDB URI — password @ must be %40
      - key: MONGO_DB
        value: "murastream_bot"
      - key: DISCORD_BRIDGE_SECRET
        sync: false
      - key: BOT_ACTIVITY
        value: "MuraStream • /help"
      - key: BOT_STATUS
        value: "online"
      - key: BOT_ADMIN_IDS
        sync: false
      - key: BOT_PREFIX
        value: "mg!"
      - key: YOUTUBE_PROXY
        sync: false          # e.g. http://user:pass@host:port — lets yt-dlp bypass YouTube's datacenter-IP challenge
      - key: YT_COOKIES_FILE
        sync: false          # path to an exported Netscape cookie jar (alternative to YT_COOKIES)
      - key: YT_COOKIES
        sync: false          # inline cookie-jar contents (alternative to YT_COOKIES_FILE)
