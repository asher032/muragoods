<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f0f1a"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffe066"/>
      <stop offset="50%" style="stop-color:#ffd60a"/>
      <stop offset="100%" style="stop-color:#d4a017"/>
    </linearGradient>
  </defs>
  <!-- Coin circle -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGrad)" opacity="0.15"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
  <!-- M letter -->
  <text x="256" y="300" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="220" fill="url(#goldGrad)">M</text>
  <!-- Star decorations -->
  <text x="120" y="140" font-family="Arial" font-size="36" fill="#ffd60a" opacity="0.5">✦</text>
  <text x="380" y="140" font-family="Arial" font-size="28" fill="#ffd60a" opacity="0.3">✦</text>
  <text x="100" y="400" font-family="Arial" font-size="24" fill="#ffd60a" opacity="0.2">✦</text>
  <text x="400" y="410" font-family="Arial" font-size="32" fill="#ffd60a" opacity="0.4">✦</text>
</svg>
