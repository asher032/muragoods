# CI: gates every pull request with typecheck, build, and the API integration
# suite. Runs the Next.js production server against a disposable MongoDB
# service container, so no secrets are needed — the TMDB route falls back to
# its sample catalog and the suite exercises profile/orders/party endpoints
# against the ephemeral database.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      # Throwaway DB inside the service container; the app connects on boot.
      MONGODB_URI: mongodb://localhost:27017/muragoods-ci
      # Sessions are HMAC-signed and AUTH_SECRET is now mandatory (session.ts
      # throws without it), so the integration suite signs in with a throwaway
      # CI-only key. This is not a secret and is never used in production.
      AUTH_SECRET: ci-only-session-signing-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocks credentials from ever reaching the repository (or its history):
      # Discord/mongo/Google/GitHub/Slack/AWS/Stripe shapes, credentials in a
      # URL, cookie-jar lines and long literals assigned to *SECRET*/*TOKEN*.
      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # A scanner that finds nothing is indistinguishable from a broken one.
      # Plants one known credential at a time in a throwaway repo and asserts
      # each is caught — plus the shapes that must NOT trip it, because a
      # scanner that fires on every process.env read gets switched off.
      - name: Secret scan control (catches planted credentials, no false alarms)
        run: node scripts/test-secret-scan.mjs

      # The bot jobs catalog must mirror the authoritative site jobs table.
      - name: Jobs table parity
        run: node scripts/check-jobs-parity.mjs

      # The bot item catalog is the single source of truth for items,
      # rarities, categories and loot tables; the site reads a generated
      # snapshot. This fails when the snapshot is stale, when a sixth
      # "legendary" tier reappears, when a per-rarity minimum drops, or when
      # the catalog stops being original.
      - name: Item catalog parity (five rarities, no Legendary, snapshot fresh)
        run: node scripts/check-items-parity.mjs

      # The dashboard's theme list and Murabot's card renderer each used to
      # carry their OWN copy, with nothing comparing them. That is how "I
      # picked a background and the Discord card did not change" stayed true
      # while both halves looked correct. This fails when the two drift, when a
      # default is missing, or when a theme's asset is absent on either side.
      - name: Level card theme parity (dashboard and Murabot render the same themes)
        run: node scripts/check-level-card-parity.mjs

      # Every dashboard save used to report a 502/503/504 as "1 setting failed
      # validation … fix the selection above". These pin the status → category
      # table, the verdict-vs-could-not-check distinction, and the Raid Alerts
      # matrix (A–J): a toggle must never be blocked by a Discord outage.
      - name: Dashboard save errors (5xx is never validation, Raid Alerts A–J)
        run: node scripts/test-save-errors.mjs

      # Proves the saved theme actually reaches Murabot's renderer: the bot
      # reads what the dashboard wrote, a change applies with no restart, and
      # two servers stay independent. Pixel-level rendering needs Pillow, which
      # is the bot's runtime dependency, so that half runs in the bot job
      # (test_level_card_backgrounds.py); this job asserts the connection.
      - name: Level card chain (dashboard → database → Murabot renderer)
        run: node scripts/test-level-card.mjs

      # The economy save route used to persist a hand-written whitelist of 12
      # keys while the form showed 21, silently dropping nine of them. These
      # tests pin the schema to the bot's own defaults and exercise the whole
      # validate → verify → all-or-nothing write path (scenarios A–I).
      - name: Economy settings save (schema parity, per-field errors, Discord verdicts)
        run: node scripts/test-economy-config.mjs

      # The dashboard reads the Murabot economy from the same collections the
      # slash commands read. This pins that implementation to the bot's own and
      # proves an empty database and a broken database are different answers —
      # the distinction that made a failure look like "No transactions yet".
      - name: Economy data source (store/bot parity, error states are never empty data)
        run: node scripts/test-economy-store.mjs

      # Owner-only economy values are gated on the AUTHENTICATED Discord user
      # id (MURABOT_OWNER_DISCORD_ID), never on a name, a guild role or a
      # client-supplied flag; and every bot-check failure keeps its own code
      # instead of one generic "did not answer".
      - name: Murabot owner identity + bot-check codes
        run: node scripts/test-murabot-owner.mjs

      # ONE person = ONE Muragoods account = ONE canonical userId. The bug this
      # pins is identity SPLIT: `Order.userId` and `SupportTicket.userId` both
      # held an EMAIL, `User.userId` keyed nothing at all, and My Space and
      # /points answered from localStorage — so one person saw a different
      # balance and a different watchlist on every device. These assert the
      # ownership matcher never lets account A read account B's row (including
      # the stale-email case), that every consumer route resolves identity from
      # the session rather than a client-supplied id, that ACCOUNT has exactly
      # six entries and the duplicate orders page is gone, that one logout
      # clears both sessions, and that the migration never deletes or merges.
      - name: Canonical identity (one userId, ownership isolation, safe migration)
        run: node scripts/test-canonical-identity.mjs

      # Murastream plays only what Muragoods is authorized to play. The
      # architecture that shipped third-party embed aggregators also shipped an
      # ad-stripping proxy, and "remove the ads with CSS/proxy" is not the same
      # guarantee as "there is no third-party source to put ads in". These
      # assert the guarantee is STRUCTURAL: the authorized-source registry
      # holds no aggregator domain, first-party media must be same-origin,
      # licensed entries are trailer/preview only, there is no ad-stripping
      # code left, the player never sees a source the registry did not issue,
      # every one of the five playback states and all nine reason codes exist
      # with safe messages, diagnostics never reach the client, temporary
      # failures are not cached as unavailable, and health reports each
      # component independently instead of one blanket verdict.
      - name: Murastream playback (authorized sources only, no ads, real states)
        run: node scripts/test-murastream-playback.mjs

      # Source scans cannot tell a working resolver from one that returns a
      # movie URL for every episode. This compiles and runs the REAL resolver
      # against a fake network, then asserts S01E01 / S01E02 / S02E01 each
      # resolve to their OWN url, a missing episode is EPISODE_NOT_RESOLVED
      # (not the nearest episode), an unknown series is SOURCE_404, a TV
      # request can never take a movie source, and season 0 is rejected.
      - name: Murastream episode resolution (real resolver, per-episode sources)
        run: node scripts/test-playback-runtime.mjs

      # Muragoods shipped as several sites wearing one name: the shop was
      # yellow, Murastream was streaming-site red in the OS UI font, and the
      # dashboard was indigo on a canvas of its own. Nothing failed — each
      # page looked correct alone, which is exactly why the drift survived.
      # These assert the ONE system structurally: a single token layer that
      # the legacy tokens derive from, Muragoods gold as the primary accent,
      # the streaming red demoted to a declared secondary accent, the
      # dashboard accent retargeted to the brand with module colours kept as
      # secondary, one font, one radius ramp, one motion ramp, one focus ring,
      # and shared primitives for cards, buttons, inputs, badges and states.
      - name: Design system (one brand, one token layer, no page-local identity)
        run: node scripts/test-design-system.mjs

      # The Admin Panel and the Discord Server Dashboard were two answers to
      # "may I?" — an email list for /admin, a live Discord permission bit for
      # /dashboard — and the split was invisible: nothing errored, each page
      # looked correct alone, and meanwhile /api/admin/analytics answered anyone
      # with the whole order book. These fail when a registry entry points at a
      # page or API that does not exist, when an admin route is not guarded by
      # the single authority (access-control.ts), when a second authority or a
      # client-side page gate creeps back, when the command prefix grows a
      # duplicate field, or when an admin API reaches into the public
      # dashboard's permission model.
      - name: Admin architecture (registry coverage, one authority, one prefix, honest saves)
        run: node scripts/check-admin-coverage.mjs

      # ONE identity across the whole ecosystem. The failure mode this pins
      # was silent: game saves lived in localStorage (so a new device started
      # at zero and clearing site data destroyed them), there was no unified
      # inventory at all, points had no transaction-id ledger, and
      # /api/reviews trusted `?isAdmin=true` to return every review in the
      # database. These assert the invariants structurally: identity from the
      # session only, one writer per system, idempotent grants, a save that
      # can never pay, guild data never merged into personal data, and
      # full access that never bypasses Discord's own checks.
      - name: Unified identity (one user, server-side saves, one points writer, no client authority)
        run: node scripts/test-unified-identity.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 2
          done
          echo "server failed to start" >&2
          exit 1

      - name: Integration suite
        run: BASE_URL=http://localhost:3000 node scripts/integration-test.mjs

  # The bot has no test framework of its own, but the YouTube egress fallback is
  # the difference between "a flagged proxy degrades music" and "a flagged proxy
  # kills music", so it is guarded here. Hermetic: yt-dlp is stubbed, so this
  # needs no network, no cookies and no proxy.
  bot-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bot dependencies
        run: pip install "discord.py>=2.4,<3.0" davey "yt-dlp[default]" python-dotenv

      # The economy suite drives the REAL economy/item service against an
      # in-process Mongo (Motor-compatible mock), so it needs no database, no
      # network and no Discord connection — but it does need the async driver
      # surface the bot uses.
      #
      # Pillow renders the level cards. The renderer degrades to styled text
      # when it is missing, which is precisely why a missing Pillow once went
      # unnoticed: the tests could not tell a card apart from a text fallback.
      # It is a runtime requirement of the bot, so it belongs here.
      - name: Install economy suite dependencies
        run: pip install pymongo mongomock mongomock-motor typing_extensions "Pillow>=10,<12"

      # The scene backgrounds are drawn with numpy; without it the generator
      # cannot reproduce the committed assets.
      - name: Install background generator dependency
        run: pip install "numpy>=1.24"

      # The database architecture is the one thing that cannot be verified by
      # running the app: the site and the bot each resolve their cluster from
      # the environment, and when they disagree nothing crashes — the dashboard
      # just quietly shows a different database than the bot. This asserts the
      # two sides declare the SAME contract, that no credential-shaped URI
      # exists in any source file, that Discord linking can never mint a local
      # user (the mechanism by which "one identity" becomes three), and that
      # the audit/migration tooling cannot delete data. Hermetic: it reads
      # source files and stubs the environment, so it needs no database.
      - name: Database architecture (two clusters, one identity, no credentials)
        run: python discord-bot/scripts/test_db_architecture.py

      # `app.router.add_get("/x", handler)` takes the NAME `handler`. If the
      # `def` has not run yet it raises NameError — and because every handler is
      # nested inside `_health_server()`, the FIRST such failure aborts the
      # whole function, so the TCPSite is never created and the bot serves no
      # HTTP at all while still appearing online on Discord. That is exactly
      # what happened: /leveling/background was registered ~90 lines above its
      # own `def`, so the live bot answered 404 and the dashboard reported
      # "Murabot could not be asked". This fails the build on any handler
      # registered before it is defined.
      - name: Bot HTTP routes are registered after their handlers exist
        run: python scripts/check_route_registration.py

      # Boots the REAL health server and asserts the routes actually answer.
      #
      # This is the check that would have caught the production outage. Two
      # separate startup crashes — `discord.VoiceTextChannel` (removed in
      # discord.py 2.7) and a handler registered above its own `def` — each
      # aborted _health_server() before it bound a port. The build SUCCEEDED
      # and the gateway stayed connected, so every deploy looked green while
      # the process served nothing, and Render kept the previous instance
      # alive. A source scan and a route-order scan both passed on that code.
      # Only actually starting the server and asking it a question finds it.
      #
      # Hermetic: no Discord gateway, no database, no network.
      - name: Bot HTTP server boots and serves the level-card routes
        run: python scripts/test_health_version.py

      - name: YouTube egress fallback (proxy configured)
        run: python discord-bot/scripts/test_youtube_egress_fallback.py

      - name: YouTube egress fallback (no proxy)
        run: python discord-bot/scripts/test_youtube_egress_fallback.py no-proxy

      # Guards the root cause of the pf11 outage: bot.latency is NaN before
      # the gateway connects, and the old truthy guard crashed /health every
      # 10 s (ValueError: cannot convert float NaN to integer).
      - name: Gateway latency NaN guard
        run: python discord-bot/scripts/test_gateway_latency_nan.py

      # Discord allows max 100 global slash commands; discord.py raises at cog
      # load once the 101st registers, silently killing a whole cog (we lost
      # leveling this way). Duplicate names across cogs do the same. Fail here,
      # in CI, instead of in production.
      - name: Slash command budget (max 100, no duplicates)
        run: python discord-bot/scripts/test_slash_command_budget.py

      # Employment gating: no job → no mini-game and no salary; resign/firing
      # clear employment and void mid-shift payouts; /level takes an OPTIONAL
      # member (bare /level) with admin under /leveling and no duplicates.
      - name: Jobs employment gates + /level command contract
        run: python discord-bot/scripts/test_jobs_employment.py

      # Root cause of the /level failure reported as Error ID MS-A98DE3:
      # unguarded numeric coercion on stored leveling data. Guild config and
      # XP rows are written by the dashboard, older bot versions and by hand,
      # so a field can be None, "", "undefined", a float, a numeric string, a
      # legacy background URL or a theme id. Every one of those reached a bare
      # int()/float() and became an unhandled ValueError. This also asserts the
      # Error Center persists the MS- id shown to the user, and redacts secrets.
      - name: Leveling config normalization (/level ValueError guard)
        run: python discord-bot/scripts/test_level_config_normalization.py

      # Item system: the five-rarity rule, the per-rarity minimums, full
      # typing of every catalog row, exact preservation of the migrated
      # originals' prices, effect validation, server-side loot, and the
      # buy/sell/trade gate that refuses forged or untradeable input.
      - name: Item system (rarity, catalog, effects, loot, security)
        run: python discord-bot/scripts/test_item_system.py

      # Item rewards are rolled by ONE service. Asserts pools derive from the
      # catalog, that a client cannot choose the item/rarity/quantity/chance,
      # that rewards are idempotent under retry, and that a market-reserved
      # item can be neither sold nor used.
      - name: Item reward service (pools, anti-exploit, reservations)
        run: python discord-bot/scripts/test_reward_system.py

      # Murashop access and pricing. Epic and Godly items were unbuyable
      # because shop availability was inferred from `buy_price > 0` and those
      # rarities shipped with no price — a hidden per-rarity rule. This buys
      # one item of EVERY rarity, checks every epic and godly item in the
      # catalog, asserts the bands, and covers funds, limited stock, a race for
      # the last copy, and rotation restock.
      - name: Murashop (all rarities purchasable, bands, stock, rotation)
        run: python discord-bot/scripts/test_shop_pricing.py

      # /deposit and /withdraw move coins between two accounts, one of which
      # has a ceiling, so both must be ONE guarded atomic update. Covers free
      # text amounts (2k / 4.5k / 30% / max), separator validation, capacity
      # clamping that never destroys the excess, the capacity-item bonus, a
      # same-member deposit race, and the full transaction record.
      - name: /deposit (parsing, bank capacity, atomicity, audit)
        run: python discord-bot/scripts/test_deposit_command.py

      # Market escrow safety. /market holds a member's coins and items outside
      # their bag, so two failure modes matter more than a crash: a listing
      # stranded in `settling` (unclaimable, escrow locked away forever) and a
      # release that runs twice for one listing (free items/coins). This drives
      # the real accept/remove/view/sweep coroutines with adversarial stored
      # documents and concurrent callers. It has already caught three live
      # bugs: a missing `field` argument in apply_delta that made every payout
      # and escrow refund raise TypeError, a coin offer that settled the two
      # sides backwards, and /market remove re-opening the listing it had just
      # released (a repeatable item-duplication exploit).
      - name: Market settlement (no stranded listings, no double refunds)
        run: python discord-bot/scripts/test_market_settlement.py

      # Executes the real /level, /rank, /leaderboard, /balance and
      # /leveling handlers against adversarial stored documents. The source
      # scan above cannot catch a ValueError that only fires at runtime, and a
      # previous pass missed exactly that in /balance and /leaderboard.
      - name: Leveling command handlers (runtime ValueError guard)
        run: python discord-bot/scripts/test_level_handlers_live.py

      # /work is the single employment surface. This loads the real cogs and
      # asserts the registered command tree: /jobs is gone, /level shift was
      # never real, /work shift is employment-gated, and the help menu cannot
      # advertise a command that no longer exists.
      - name: /work command tree (/jobs removed, /level shift absent)
        run: python discord-bot/scripts/test_work_command_tree.py

      # Executes the real /work list/status/apply/history/stars handlers and
      # the job library against adversarial stored documents. Found the
      # remaining MS-B8A02F conversions that a source scan declared clean.
      - name: /work handlers + job catalog (runtime ValueError guard)
        run: python discord-bot/scripts/test_work_handlers_live.py

      # /work shift's real blocker: JobBrowser packed 11 components into two
      # action rows and the nav button overflowed row 1, raising ValueError in
      # the constructor before any button existed. Runs the real command
      # through every branch and asserts every browser page lays out.
      - name: /work shift branches + job browser layout
        run: python discord-bot/scripts/test_work_shift_live.py

      # The dashboard reported a leaderboard whose top holders did not
      # reconcile with circulation. Root cause: the net sort was
      # `{$add: ["$balance", "$bank"]}`, and Mongo propagates a MISSING
      # operand as null rather than 0 — so any wallet without a `bank` key
      # sorted as null and fell out of the top-N while still counting toward
      # circulation. This pins that regression, asserts circulation equals
      # SUM(balance)+SUM(bank), that leaderboard identity is the canonical
      # user id rather than a display name, and that no catalog row allows a
      # buy->sell profit.
      - name: Economy dashboard (circulation, canonical leaderboard, arbitrage)
        run: python discord-bot/scripts/test_economy_dashboard.py

      # Economic BALANCE, as one connected system rather than per-command.
      # Drives the real economy code through the shop, market, reward,
      # gambling, multi-account, flow-ledger and lottery loops and asserts the
      # invariants that hold the economy together: no buy/sell arbitrage
      # across every catalogue item, a losing round trip, exactly one reward
      # per claim, bounded minigame EV, transfers that create nothing, and
      # created/destroyed that reconcile with real wallet balances.
      - name: Economy balance (loops, arbitrage, EV, ledger reconciliation)
        run: python discord-bot/scripts/test_economy_balance.py

      # The Murabot owner is one Discord USER ID, and it is neither a name, nor
      # a guild role, nor "an admin". The bot check is answered from the
      # gateway cache and keeps a distinct code per failure. Hermetic: no
      # network, no database, no gateway.
      - name: Murabot owner identity + gateway channel checks
        run: python discord-bot/scripts/test_economy_owner_and_channels.py

      # The pixel-level half of the level-card fix, where Pillow is actually
      # installed. The Node job asserts the dashboard → database → renderer
      # chain; this asserts that each theme paints a genuinely DIFFERENT
      # background, and that a bad theme falls back instead of rendering a
      # blank card (which is indistinguishable from "the setting does nothing").
      - name: Level card backgrounds (distinct pixels, safe fallback)
        run: python discord-bot/scripts/test_level_card_backgrounds.py

      # Reproduces the actual reported failure: the dashboard writes a
      # guild_config the bot never reads, so /level keeps rendering the default
      # while the save reports success. Proves the bot-owned write path closes
      # it, that a second change needs no restart, and that the diagnostic
      # reports both sides honestly.
      - name: Level card config chain (dashboard write reaches the renderer)
        run: python discord-bot/scripts/test_level_config_chain.py

      # The end-to-end acceptance test for the reported bug: "I pick a
      # background, I save, and the Discord card does not change."
      #
      # The suites above each cover one hop. This one runs the whole chain the
      # operator actually performs — dashboard selection, save, verify the
      # stored record, run /level, inspect the rendered PNG — three times with
      # three different themes, and asserts the PNG is byte-identical to
      # rendering that theme alone. It also pins the two properties that made
      # this bug survive earlier fixes: the configuration is re-read from the
      # database on every card (no cache, so no restart), and /level and the
      # automatic level-up card share one builder.
      #
      # This is the check that fails if the canonical `server_card_background`
      # field is ever dropped from the config whitelist again, or if a stale
      # value in one field is allowed to outrank the selection being saved.
      - name: Level card acceptance (selection → save → rendered PNG)
        run: python scripts/acceptance_level_background.py

      # The scene themes are generated artwork, and the renderer lays a dark
      # gradient plus a luminance-scaled shade over every backdrop. An asset
      # that is attractive on its own can still come out of that pipeline as a
      # near-black panel — indistinguishable from "the background setting does
      # nothing", which is the failure this area keeps producing. So this
      # renders each theme through the REAL card path and asserts it kept real
      # tonal range, that its luminance stayed legible, and that it is distinct
      # from every other theme including the hand-drawn ones.
      - name: Level card backgrounds survive the card renderer
        run: python scripts/check_level_background_quality.py
