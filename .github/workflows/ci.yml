# CI: gates every pull request with typecheck, build, and the API integration
# suite. Runs the Next.js production server against a disposable MongoDB
# service container, so no secrets are needed — the TMDB route falls back to
# its sample catalog and the suite exercises profile/orders/party endpoints
# against the ephemeral database.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      # Throwaway DB inside the service container; the app connects on boot.
      MONGODB_URI: mongodb://localhost:27017/muragoods-ci
      # Sessions are HMAC-signed and AUTH_SECRET is now mandatory (session.ts
      # throws without it), so the integration suite signs in with a throwaway
      # CI-only key. This is not a secret and is never used in production.
      AUTH_SECRET: ci-only-session-signing-key-not-a-real-secret

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocks credentials from ever reaching the repository (or its history):
      # Discord/mongo/Google/GitHub/Slack/AWS/Stripe shapes, credentials in a
      # URL, cookie-jar lines and long literals assigned to *SECRET*/*TOKEN*.
      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # The bot jobs catalog must mirror the authoritative site jobs table.
      - name: Jobs table parity
        run: node scripts/check-jobs-parity.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 2
          done
          echo "server failed to start" >&2
          exit 1

      - name: Integration suite
        run: BASE_URL=http://localhost:3000 node scripts/integration-test.mjs

  # The bot has no test framework of its own, but the YouTube egress fallback is
  # the difference between "a flagged proxy degrades music" and "a flagged proxy
  # kills music", so it is guarded here. Hermetic: yt-dlp is stubbed, so this
  # needs no network, no cookies and no proxy.
  bot-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bot dependencies
        run: pip install "discord.py>=2.4,<3.0" davey "yt-dlp[default]" python-dotenv

      - name: YouTube egress fallback (proxy configured)
        run: python discord-bot/scripts/test_youtube_egress_fallback.py

      - name: YouTube egress fallback (no proxy)
        run: python discord-bot/scripts/test_youtube_egress_fallback.py no-proxy

      # Guards the root cause of the pf11 outage: bot.latency is NaN before
      # the gateway connects, and the old truthy guard crashed /health every
      # 10 s (ValueError: cannot convert float NaN to integer).
      - name: Gateway latency NaN guard
        run: python discord-bot/scripts/test_gateway_latency_nan.py

      # Discord allows max 100 global slash commands; discord.py raises at cog
      # load once the 101st registers, silently killing a whole cog (we lost
      # leveling this way). Duplicate names across cogs do the same. Fail here,
      # in CI, instead of in production.
      - name: Slash command budget (max 100, no duplicates)
        run: python discord-bot/scripts/test_slash_command_budget.py

      # Employment gating: no job → no mini-game and no salary; resign/firing
      # clear employment and void mid-shift payouts; /level takes an OPTIONAL
      # member (bare /level) with admin under /leveling and no duplicates.
      - name: Jobs employment gates + /level command contract
        run: python discord-bot/scripts/test_jobs_employment.py

      # Root cause of the /level failure reported as Error ID MS-A98DE3:
      # unguarded numeric coercion on stored leveling data. Guild config and
      # XP rows are written by the dashboard, older bot versions and by hand,
      # so a field can be None, "", "undefined", a float, a numeric string, a
      # legacy background URL or a theme id. Every one of those reached a bare
      # int()/float() and became an unhandled ValueError. This also asserts the
      # Error Center persists the MS- id shown to the user, and redacts secrets.
      - name: Leveling config normalization (/level ValueError guard)
        run: python discord-bot/scripts/test_level_config_normalization.py

      # Executes the real /level, /rank, /leaderboard, /balance and
      # /leveling handlers against adversarial stored documents. The source
      # scan above cannot catch a ValueError that only fires at runtime, and a
      # previous pass missed exactly that in /balance and /leaderboard.
      - name: Leveling command handlers (runtime ValueError guard)
        run: python discord-bot/scripts/test_level_handlers_live.py

      # /work is the single employment surface. This loads the real cogs and
      # asserts the registered command tree: /jobs is gone, /level shift was
      # never real, /work shift is employment-gated, and the help menu cannot
      # advertise a command that no longer exists.
      - name: /work command tree (/jobs removed, /level shift absent)
        run: python discord-bot/scripts/test_work_command_tree.py

      # Executes the real /work list/status/apply/history/stars handlers and
      # the job library against adversarial stored documents. Found the
      # remaining MS-B8A02F conversions that a source scan declared clean.
      - name: /work handlers + job catalog (runtime ValueError guard)
        run: python discord-bot/scripts/test_work_handlers_live.py
