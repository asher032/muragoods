services:
  - type: web
    name: murastream-bot-pf11
    runtime: python
    plan: starter
    region: oregon
    rootDir: discord-bot
    # Node.js (provided by the Render image) carries yt-dlp's
    # signature-challenge solving, and the bot enables all runtimes
    # explicitly — so no Deno download happens here.
    # (scripts/install_deno.py remains available as an optional local
    # fallback, but it must NOT block the production build: its ~100MB
    # download repeatedly stalled the free builder and failed deploys.)
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false          # set in the Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        value: "1549395794853888020"
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: MURASTREAM_URL
        value: "https://muragoods.vercel.app"
      - key: TMDB_API_KEY
        sync: false          # optional; the site proxy works without it
      - key: MONGO_URI
        sync: false          # MongoDB URI (bot cluster)
      - key: MONGO_DB
        value: "murastream_bot"
      - key: DISCORD_BRIDGE_SECRET
        sync: false
      - key: BOT_ACTIVITY
        value: "MuraStream • /help"
      - key: BOT_STATUS
        value: "online"
      # Boot-fatal: bot/config.py validate() does sys.exit(1) when this is
      # missing, so the deploy dies before /health can ever answer. REPLACE
      # the placeholder with your Discord user ID — digits only (config.py
      # parses it with str.isdigit(), so a username or a #tag silently becomes
      # None and the bot still exits). Get it: Developer Mode enabled →
      # right-click your profile → Copy User ID. Do NOT use the application id
      # from /health (1549395794853888020) — that is the bot, not you.
      # app/lib/murabot-owner.ts reads this same variable, so set the identical
      # value on Vercel or the dashboard owner checks will disagree with the bot.
      - key: MURABOT_OWNER_DISCORD_ID
        value: "YOUR_DISCORD_USER_ID_HERE"
      - key: BOT_ADMIN_IDS
        sync: false
      - key: BOT_PREFIX
        value: "mg!"
      - key: YOUTUBE_PROXY
        sync: false          # e.g. http://user:pass@host:port — lets yt-dlp bypass YouTube's datacenter-IP challenge
      - key: YT_COOKIES_FILE
        sync: false          # path to an exported Netscape cookie jar (alternative to YT_COOKIES)
      - key: YT_COOKIES
        sync: false          # inline cookie-jar contents (alternative to YT_COOKIES_FILE)
