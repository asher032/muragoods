services:
  - type: web
    name: murastream-bot-pf11
    runtime: python
    plan: starter
    region: oregon
    rootDir: discord-bot
    # The JavaScript runtime is not optional: yt-dlp cannot solve YouTube's
    # signature / n-parameter challenge without one, and that failure reads
    # exactly like an IP block. Downloaded into ./bin, which bot/music.py
    # prepends to PATH at import so yt-dlp can actually find it.
    buildCommand: pip install -r requirements.txt && python scripts/install_deno.py
    startCommand: python -m bot.main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DISCORD_TOKEN
        sync: false          # set in the Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        value: "1549395794853888020"
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: MURASTREAM_URL
        value: "https://muragoods.vercel.app"
      - key: TMDB_API_KEY
        sync: false          # optional; the site proxy works without it
      - key: MONGO_URI
        sync: false          # MongoDB URI (bot cluster)
      - key: MONGO_DB
        value: "murastream_bot"
      - key: DISCORD_BRIDGE_SECRET
        sync: false
      - key: BOT_ACTIVITY
        value: "MuraStream • /help"
      - key: BOT_STATUS
        value: "online"
      - key: BOT_ADMIN_IDS
        sync: false
      - key: BOT_PREFIX
        value: "mg!"
      - key: YOUTUBE_PROXY
        sync: false          # e.g. http://user:pass@host:port — lets yt-dlp bypass YouTube's datacenter-IP challenge
      - key: YT_COOKIES_FILE
        sync: false          # path to an exported Netscape cookie jar (alternative to YT_COOKIES)
      - key: YT_COOKIES
        sync: false          # inline cookie-jar contents (alternative to YT_COOKIES_FILE)
